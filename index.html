<!-- Discord Activity build of the timer; the public website lives in the pomodoro-timer repo -->

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🟣%3C/text%3E%3C/svg%3E" />
<!-- Libraries are vendored (not loaded from CDNs) so the page also works inside a Discord Activity,
     whose proxy blocks requests to domains that aren't URL-mapped in the Developer Portal -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<script src="vendor/tailwindcss-3.4.17.js"></script>
<script>
  // Without this, tapping a button on a touch device leaves its hover: styles (e.g. the
  // darker background on the round control buttons) stuck on until something else is tapped,
  // since there's no mouse to trigger a "leave". This scopes every hover: utility to devices
  // that actually support hovering, matching how a real mouse/trackpad behaves.
  tailwind.config = { future: { hoverOnlyWhenSupported: true } };
</script>
<!-- Discord Activity wrapper + shared timer state. Inside Discord the room is the Activity instance,
     so everyone in the voice channel sees one timer; in a plain browser, open the page with
     ?room=<name> to test syncing between tabs. Without a room the timer runs standalone. -->
<script type="module">
const DISCORD_CLIENT_ID = "1552028275574964275"; // Developer Portal → OAuth2 → Client ID (public, not a secret)
// Firebase web config is a public identifier, not a secret; access is limited by the database rules
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCOwTuLww-HLUrNZsJlaEtd-7q4FCGCzoA",
  databaseURL: "https://violet-tomato-discord-activity-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "violet-tomato-discord-activity",
  appId: "1:304315009793:web:9de620aa871ef04d0da900",
};

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`Failed to load ${src}`));
    document.head.appendChild(el);
  });
}

// Resolves to the sync API the timer component uses, or null when there's no room to sync with.
// Assigned synchronously so it exists before the timer component mounts.
window.timerSyncReady = (async () => {
  const params = new URLSearchParams(location.search);
  let roomId = params.get("room");

  if (params.has("frame_id")) {
    try {
      const { DiscordSDK } = await import("./vendor/discord-embedded-app-sdk-2.5.0.mjs");
      const discordSdk = new DiscordSDK(DISCORD_CLIENT_ID);
      await discordSdk.ready(); // tells Discord to hide its loading screen
      window.discordSdk = discordSdk;
      roomId = discordSdk.instanceId;

      // Discord's proxy blocks direct requests to Firebase, so route its WebSocket through the URL
      // Mapping /rtdb → <database host> set in the Developer Portal. Firebase also hands clients a
      // per-shard hostname to reconnect to; those all go to the same mapping, since the main host
      // accepts connections itself (the ns= query parameter names the database). Must run before
      // the Firebase script loads, since it grabs the WebSocket constructor at load time.
      const NativeWebSocket = window.WebSocket;
      window.WebSocket = class extends NativeWebSocket {
        constructor(url, protocols) {
          const u = new URL(url);
          if (u.hostname.endsWith(".firebasedatabase.app")) {
            u.host = location.host;
            u.pathname = "/.proxy/rtdb" + u.pathname;
            if (!u.searchParams.has("ns")) u.searchParams.set("ns", new URL(FIREBASE_CONFIG.databaseURL).hostname.split(".")[0]);
          }
          super(u, protocols);
        }
      };

      // Plain target="_blank" links don't open from inside the Activity iframe; route them through Discord
      document.addEventListener("click", (e) => {
        const link = e.target.closest("a[href^='http']");
        if (!link) return;
        e.preventDefault();
        discordSdk.commands.openExternalLink({ url: link.href });
      });
    } catch (err) {
      console.error("Discord SDK init failed:", err);
    }
  }

  if (!roomId) return null;

  try {
    await loadScript("vendor/firebase-app-compat-12.4.0.js");
    await loadScript("vendor/firebase-database-compat-12.4.0.js");
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    db.INTERNAL.forceWebSockets(); // the long-polling fallback can't get through Discord's proxy
    const stateRef = db.ref(`rooms/${roomId.replace(/[.#$\[\]\/]/g, "_")}/state`);

    // Devices' clocks disagree; Firebase reports how far this one is from the server's, so every
    // participant can compute the countdown against the same clock.
    let clockOffsetMs = 0;
    db.ref(".info/serverTimeOffset").on("value", (snap) => { clockOffsetMs = snap.val() || 0; });

    return {
      now: () => Date.now() + clockOffsetMs,
      // onState gets { rev, json } (or null for a brand-new room) now and after every change —
      // including this client's own writes, and the winning write when one of ours loses a race.
      subscribe(onState, onConnected, onError) {
        stateRef.on("value", (snap) => onState(snap.val()), onError);
        db.ref(".info/connected").on("value", (snap) => onConnected(snap.val() === true));
      },
      // Writes only if nobody else changed the room since baseRev; otherwise the write is dropped
      // and subscribe() delivers the state that got there first.
      publish(baseRev, next) {
        const value = { rev: next.rev, json: JSON.stringify(next) };
        stateRef
          .transaction((cur) => ((cur ? cur.rev : 0) === baseRev ? value : undefined))
          .catch((err) => console.error("Sync write failed:", err));
      },
    };
  } catch (err) {
    console.error("Sync init failed:", err);
    window.timerSyncFailed = true;
    return null;
  }
})();
</script>

<div id="root">
<noscript>
<main style="font-family:system-ui,sans-serif;max-width:32rem;margin:4rem auto;padding:0 1rem;text-align:center;color:#444">
<h1>Automatic Pomodoro Focus Timer</h1>
<p>Start once: 25-minute focus rounds and 5-minute breaks switch automatically, each one is logged and ends with a sound alert. Set a round limit, or let it run without one, and choose whether every 4th round gets a longer break. Free, no sign-up.</p>
<p>Please enable JavaScript to use the timer.</p>
</main>
</noscript>
</div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const WORK_MIN = 25;
const BREAK_MIN = 5;
const LONG_BREAK_MIN = 30;
const CYCLES_BEFORE_LONG_BREAK = 4;

// null = no long break at all — every 4th round just gets the regular short break instead
const LONG_BREAK_OPTIONS = [
  { value: 15, label: "15 min" },
  { value: 30, label: "30 min" },
  { value: null, label: "None" },
];

const START_WITH_OPTIONS = [
  { value: true, label: "Break" },
  { value: false, label: "Focus" },
];

const COMPLETION_HEADINGS = ["Great job!", "Nice work!", "You crushed it!", "Well done!", "Way to go!", "Amazing focus!"];

const MODES = {
  work: { label: "Focus", minutes: WORK_MIN, color: "#7c3aed", arcColor: "#d1baf6", shadowColor: "#7c3aed", emoji: ["📚", "💻", "✍️"], bg: "#f5f3ff" },
  break: { label: "Break", minutes: BREAK_MIN, color: "#009AE2", arcColor: "#abdef5", shadowColor: "#006DA1", emoji: "☕", bg: "#f0f9ff" },
  longBreak: { label: "Long break", minutes: LONG_BREAK_MIN, color: "#009C99", arcColor: "#ABDEDD", shadowColor: "#007371", emoji: "🌴", bg: "#ecfeff" },
};

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, "0");
  const sec = (s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}

function formatClock(date) {
  const h = date.getHours().toString().padStart(2, "0");
  const m = date.getMinutes().toString().padStart(2, "0");
  return `${h}:${m}`;
}

const N = { G4:392.00, A4:440.00, C5:523.25, D5:587.33, E5:659.25, G5:783.99, A5:880.00, C6:1046.50, D6:1174.66, E6:1318.51, G6:1567.98 };

function playNotes(notes) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const now = ctx.currentTime;
  let maxEnd = 0;
  notes.forEach(({ freq, start, dur, gain = 0.22, type = "sine" }) => {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    const t0 = now + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur);
    maxEnd = Math.max(maxEnd, start + dur);
  });
  setTimeout(() => ctx.close(), (maxEnd + 0.3) * 1000);
}

const FANFARE_EXTENDED = [
  { freq: N.G4, start: 0,    dur: 0.2 },
  { freq: N.C5, start: 0.15, dur: 0.2 },
  { freq: N.E5, start: 0.30, dur: 0.2 },
  { freq: N.G5, start: 0.45, dur: 0.2 },
  { freq: N.C6, start: 0.60, dur: 0.2 },
  { freq: N.E6, start: 0.75, dur: 0.2 },
  { freq: N.G6, start: 0.90, dur: 0.25 },
  { freq: N.C6, start: 1.10, dur: 0.8 },
];

const PENTATONIC_CLIMB = [
  { freq: N.C5, start: 0,    dur: 0.22 },
  { freq: N.D5, start: 0.16, dur: 0.22 },
  { freq: N.E5, start: 0.32, dur: 0.22 },
  { freq: N.G5, start: 0.48, dur: 0.22 },
  { freq: N.A5, start: 0.64, dur: 0.22 },
  { freq: N.C6, start: 0.80, dur: 0.6 },
];

function playSound(kind) {
  // kind: "workEnd" — a focus round just finished, "breakEnd" — a break just finished
  playNotes(kind === "workEnd" ? FANFARE_EXTENDED : PENTATONIC_CLIMB);
}

// how long each melody actually plays, used to hold off starting the next round
const SOUND_DURATION_MS = { workEnd: 1900, breakEnd: 1400 };

function Icon({ children, size = 18, className, style }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} style={style}>
      {children}
    </svg>
  );
}
const PlayIcon = (props) => <Icon {...props}><polygon points="6 3 20 12 6 21 6 3" /></Icon>;
const PauseIcon = (props) => <Icon {...props}><rect x="14" y="4" width="4" height="16" rx="1" /><rect x="6" y="4" width="4" height="16" rx="1" /></Icon>;
const RotateCcwIcon = (props) => <Icon {...props}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path d="M3 3v5h5" /></Icon>;
const SkipForwardIcon = (props) => <Icon {...props}><polygon points="5 4 15 12 5 20 5 4" /><line x1="19" x2="19" y1="5" y2="19" /></Icon>;
const ChevronDownIcon = (props) => <Icon {...props}><path d="m6 9 6 6 6-6" /></Icon>;
const ChevronUpIcon = (props) => <Icon {...props}><path d="m18 15-6-6-6 6" /></Icon>;
const MinusIcon = (props) => <Icon {...props}><line x1="5" y1="12" x2="19" y2="12" /></Icon>;
const PlusIcon = (props) => <Icon {...props}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></Icon>;

// A proper ARIA radiogroup: one tab stop for the whole group (only the checked option is in the
// tab order), Left/Up and Right/Down move the checked option and keyboard focus together. Since
// focus and selection always coincide here, the checked pill's own ring already shows where
// focus is — no separate focus ring is drawn on top of it.
function RadioGroup({ label, options, value, onChange, pillClassName }) {
  function handleKeyDown(e) {
    const dir = e.key === "ArrowRight" || e.key === "ArrowDown" ? 1 : e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 0;
    if (!dir) return;
    e.preventDefault();
    const idx = options.findIndex((o) => o.value === value);
    const nextIdx = (idx + dir + options.length) % options.length;
    onChange(options[nextIdx].value);
    e.currentTarget.querySelectorAll('[role="radio"]')[nextIdx]?.focus();
  }

  return (
    <div className="w-full flex flex-col items-start gap-2">
      <div className="text-sm font-medium text-neutral-600">{label}</div>
      <div role="radiogroup" aria-label={label} onKeyDown={handleKeyDown} className="flex gap-2">
        {options.map((opt) => {
          const selected = value === opt.value;
          return (
            <button
              key={String(opt.value)}
              type="button"
              role="radio"
              aria-checked={selected}
              tabIndex={selected ? 0 : -1}
              onClick={() => onChange(opt.value)}
              className={`${pillClassName} focus-visible:outline-none ${
                selected
                  ? "ring-2 ring-inset ring-violet-500 bg-violet-50 text-violet-700"
                  : "ring-1 ring-inset ring-neutral-200 text-neutral-500"
              }`}
            >
              {opt.label}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function HistoryLog({ history }) {
  return (
    <div className="flex flex-col items-start gap-0.5 mt-4 text-left">
      {history.map((entry, i) => {
        const label = entry.type === "focus" ? "focus" : entry.type === "break" ? "break" : "long break";
        return (
          <div key={i} className="flex text-xs" style={{ color: "#666666" }}>
            <span className="inline-block" style={{ width: "80px" }}>{label}</span>
            <span className="font-mono">
              {formatClock(new Date(entry.start))} – {formatClock(new Date(entry.end))}
            </span>
          </div>
        );
      })}
    </div>
  );
}

function Credit({ inert }) {
  return (
    <div
      inert={inert ? "" : undefined}
      className="w-full flex items-center justify-center gap-1 py-4"
      style={{ fontSize: "10px", color: "#999999" }}
    >
      <span>Made by Elena Kovelskikh</span>
      <span>·</span>
      <a href="https://www.linkedin.com/in/kovelskikh/" target="_blank" rel="noopener noreferrer" className="hover:text-neutral-600 underline">
        LinkedIn
      </a>
      <span>·</span>
      <a href="https://github.com/elenakovelskikh" target="_blank" rel="noopener noreferrer" className="hover:text-neutral-600 underline">
        GitHub
      </a>
    </div>
  );
}

// Everything about the session lives in this one object so it can be shared as-is: whatever one
// participant does — including opening the log or a popup — shows up for everyone in the room.
// Times are timestamps (ms) on the shared clock, never Date objects, so the state survives JSON.
const INITIAL_STATE = {
  rev: 0, // bumped on every change; lets two people changing the room at once be told apart
  mode: "work",
  segmentTotal: WORK_MIN * 60,
  isRunning: false,
  completedCycles: 0,
  history: [],
  logOpen: false,
  summaryLogOpen: false,
  isTransitioning: false,
  preTransitionLabel: "Pause",
  longBreakMinutes: 30,
  roundsLimit: null, // null = unlimited (default), number = limit
  setupComplete: false,
  sessionComplete: false,
  completionHeading: "Great job!",
  addRoundsModalOpen: false,
  addRoundsAmount: 4,
  addStartsWithBreak: true,
  originalRoundsChoice: null,
  // The countdown isn't stored — it's derived from when the segment really started, minus the
  // time spent paused (pausedMs so far, plus the pause in progress since pauseStartedAt, if any).
  // segmentStart must stay the true start for the session log.
  segmentStart: null,
  pausedMs: 0,
  pauseStartedAt: null,
  // While the end-of-segment sound plays: what comes after it, and when ({ mode, total, at } or
  // { complete, heading, at }). Stored rather than held in a timeout so any participant can finish
  // the transition, even if the one who triggered it has left.
  next: null,
};

// Recomputed from the real start time (rather than decremented once a second) so a throttled or
// fully paused background tab still lands on the correct remaining time the moment it's looked at
// again — and so every participant shows the same number.
function remainingSeconds(s, now) {
  if (s.segmentStart == null) return s.segmentTotal;
  const pausedMs = s.pausedMs + (s.pauseStartedAt != null ? now - s.pauseStartedAt : 0);
  const elapsed = Math.floor((now - s.segmentStart - pausedMs) / 1000);
  return Math.max(0, Math.min(s.segmentTotal, s.segmentTotal - elapsed));
}

function toggleLabel(s, now) {
  return s.isRunning ? "Pause" : remainingSeconds(s, now) === s.segmentTotal ? "Start" : "Resume";
}

function freshSegment(mode, total, now) {
  return { mode, segmentTotal: total, segmentStart: now, pausedMs: 0, pauseStartedAt: null, isRunning: true };
}

// Ends the current segment: logs it, then holds for the length of the end-of-segment sound
// before `next` takes over (see the finishTransition action).
function beginTransition(s, now, label, next) {
  const soundKind = s.mode === "work" ? "workEnd" : "breakEnd";
  const completedCycles = s.mode === "work" ? s.completedCycles + 1 : s.completedCycles;
  const entry = {
    type: s.mode === "work" ? "focus" : s.mode === "longBreak" ? "longBreak" : "break",
    round: completedCycles,
    start: s.segmentStart ?? now,
    end: now,
  };
  return {
    ...s,
    completedCycles,
    history: [...s.history, entry].slice(-300),
    preTransitionLabel: label,
    isRunning: false,
    isTransitioning: true,
    pauseStartedAt: s.pauseStartedAt ?? now, // freeze the countdown where it stopped
    next: { ...next, at: now + SOUND_DURATION_MS[soundKind] },
  };
}

// The current segment is over (timer hit zero, or Skip): work out what follows it
function completeSegment(s, now, label) {
  const newCompleted = s.completedCycles + 1;
  let next;
  if (s.mode === "work" && s.roundsLimit && newCompleted >= s.roundsLimit) {
    // the last permitted focus is done — end the session right away, no trailing break
    next = { complete: true, heading: COMPLETION_HEADINGS[Math.floor(Math.random() * COMPLETION_HEADINGS.length)] };
  } else if (s.mode === "work") {
    const isLongBreak = newCompleted % CYCLES_BEFORE_LONG_BREAK === 0 && s.longBreakMinutes !== null;
    next = { mode: isLongBreak ? "longBreak" : "break", total: (isLongBreak ? s.longBreakMinutes : BREAK_MIN) * 60 };
  } else {
    next = { mode: "work", total: WORK_MIN * 60 };
  }
  return beginTransition(s, now, label, next);
}

// Returns the new state, or the same object when the action doesn't apply (e.g. a second
// participant's click that arrived after the first one already did the same thing).
function reduce(s, action, now) {
  switch (action.type) {
    case "set": {
      const value = typeof action.value === "function" ? action.value(s[action.key]) : action.value;
      return value === s[action.key] ? s : { ...s, [action.key]: value };
    }
    case "startSession":
      if (s.setupComplete) return s;
      return { ...s, setupComplete: true, originalRoundsChoice: s.roundsLimit, ...freshSegment("work", WORK_MIN * 60, now) };
    case "toggle":
      if (s.isTransitioning) return s;
      if (s.isRunning) return { ...s, isRunning: false, pauseStartedAt: now };
      if (s.segmentStart == null) return { ...s, isRunning: true, segmentStart: now, pausedMs: 0, pauseStartedAt: null };
      // resuming: fold the just-finished pause into the running total so it isn't counted as
      // elapsed segment time
      return {
        ...s,
        isRunning: true,
        pausedMs: s.pausedMs + (s.pauseStartedAt != null ? now - s.pauseStartedAt : 0),
        pauseStartedAt: null,
      };
    case "reset": {
      if (s.isTransitioning) return s;
      const minutes = s.mode === "longBreak" ? s.longBreakMinutes ?? LONG_BREAK_MIN : MODES[s.mode].minutes;
      return { ...s, ...freshSegment(s.mode, minutes * 60, now) };
    }
    case "autoComplete":
      // automatic: timer hit zero
      if (!s.isRunning || s.isTransitioning || remainingSeconds(s, now) > 0) return s;
      return completeSegment(s, now, "Pause");
    case "skip":
      // reuse the same sound + transition-delay flow as auto-complete, so it's easy to test
      if (s.isTransitioning) return s;
      return completeSegment(s, now, toggleLabel(s, now));
    case "switchToShortBreak":
      // lets the group cut a 30-min long break short and drop into a fresh 5-min break instead
      if (s.isTransitioning || s.mode !== "longBreak") return s;
      return beginTransition(s, now, toggleLabel(s, now), { mode: "break", total: BREAK_MIN * 60 });
    case "startLongBreak": {
      // mins lets a one-off long break be started even when the auto-cycle's long break is set to
      // "None" — it doesn't touch the longBreakMinutes setting, so the 4th-round rule stays as
      // configured. Falls back to 30 min when it is None, so the manual button always works.
      if (s.isTransitioning) return s;
      const minutes = action.mins ?? s.longBreakMinutes ?? LONG_BREAK_MIN;
      return beginTransition(s, now, toggleLabel(s, now), { mode: "longBreak", total: minutes * 60 });
    }
    case "addFiveMinutes":
      // lets the group top up the current long break by 5 more minutes — extending the total
      // means the progress ring reflects the new, longer duration instead of jumping backwards
      if (s.isTransitioning) return s;
      return { ...s, segmentTotal: s.segmentTotal + 5 * 60 };
    case "confirmAddRounds": {
      if (!s.addRoundsModalOpen) return s;
      let nextMode = "work";
      if (s.addStartsWithBreak) {
        nextMode = s.completedCycles % CYCLES_BEFORE_LONG_BREAK === 0 && s.longBreakMinutes !== null ? "longBreak" : "break";
      }
      const total = (nextMode === "longBreak" ? s.longBreakMinutes : MODES[nextMode].minutes) * 60;
      return {
        ...s,
        roundsLimit: s.addRoundsAmount === null ? null : (s.roundsLimit ?? 0) + s.addRoundsAmount,
        addRoundsModalOpen: false,
        sessionComplete: false,
        ...freshSegment(nextMode, total, now),
      };
    }
    case "finishTransition":
      // the sound has finished — start what was lined up
      if (!s.isTransitioning || !s.next) return s;
      if (s.next.complete) {
        return { ...s, isTransitioning: false, next: null, completionHeading: s.next.heading, sessionComplete: true };
      }
      return { ...s, isTransitioning: false, next: null, ...freshSegment(s.next.mode, s.next.total, now) };
    default:
      return s;
  }
}

function PomodoroTimer() {
  const [state, setState] = useState(INITIAL_STATE);
  const stateRef = useRef(INITIAL_STATE);
  const syncRef = useRef(null);
  // "loading" until we know whether there's a room to sync with and have its current state;
  // then "synced", "local" (no room: plain standalone timer) or "failed" (room unreachable)
  const [syncStatus, setSyncStatus] = useState(window.timerSyncReady ? "loading" : "local");
  const [connected, setConnected] = useState(true);
  const [, setTick] = useState(0);

  // the shared clock when syncing, so every participant computes the same countdown
  const now = () => (syncRef.current ? syncRef.current.now() : Date.now());

  // Every change goes through here: applied locally right away, then offered to the room. If
  // someone else changed the room first, the write is dropped and their state arrives instead.
  const dispatch = useCallback((action) => {
    const base = stateRef.current;
    const reduced = reduce(base, action, now());
    if (reduced === base) return;
    const next = { ...reduced, rev: base.rev + 1 };
    stateRef.current = next;
    setState(next);
    if (syncRef.current) syncRef.current.publish(base.rev, next);
  }, []);

  useEffect(() => {
    if (!window.timerSyncReady) return;
    let cancelled = false;
    // don't leave people staring at a blank screen if the room can't be reached
    const giveUp = setTimeout(() => setSyncStatus((st) => (st === "loading" ? "failed" : st)), 10000);
    window.timerSyncReady.then((sync) => {
      if (cancelled) return;
      if (!sync) {
        clearTimeout(giveUp);
        setSyncStatus(window.timerSyncFailed ? "failed" : "local");
        return;
      }
      syncRef.current = sync;
      sync.subscribe(
        (value) => {
          clearTimeout(giveUp);
          if (value) {
            const next = { ...INITIAL_STATE, ...JSON.parse(value.json), rev: value.rev };
            stateRef.current = next;
            setState(next);
          } else if (stateRef.current.rev > 0) {
            // the room is empty but a timer is already going here (it started before the
            // connection came up) — make it the room's timer
            const next = { ...stateRef.current, rev: 1 };
            stateRef.current = next;
            setState(next);
            sync.publish(0, next);
          }
          setSyncStatus("synced");
        },
        setConnected,
        (err) => {
          console.error("Sync read failed:", err);
          syncRef.current = null;
          setSyncStatus("failed");
        }
      );
    });
    return () => {
      cancelled = true;
      clearTimeout(giveUp);
    };
  }, []);

  const {
    mode, segmentTotal, isRunning, completedCycles, history, logOpen, summaryLogOpen, isTransitioning,
    preTransitionLabel, longBreakMinutes, roundsLimit, setupComplete, sessionComplete, completionHeading,
    addRoundsModalOpen, addRoundsAmount, addStartsWithBreak, originalRoundsChoice,
  } = state;

  const secondsLeft = remainingSeconds(state, now());
  const totalSeconds = segmentTotal;
  const progress = 1 - secondsLeft / totalSeconds;

  // same call shape as a useState setter (value or updater function), but shared with the room
  const setter = (key) => (value) => dispatch({ type: "set", key, value });
  const setLogOpen = setter("logOpen");
  const setSummaryLogOpen = setter("summaryLogOpen");
  const setLongBreakMinutes = setter("longBreakMinutes");
  const setRoundsLimit = setter("roundsLimit");
  const setAddRoundsModalOpen = setter("addRoundsModalOpen");
  const setAddRoundsAmount = setter("addRoundsAmount");
  const setAddStartsWithBreak = setter("addStartsWithBreak");

  const startSession = () => dispatch({ type: "startSession" });
  const confirmAddRounds = () => dispatch({ type: "confirmAddRounds" });
  const handleToggle = () => dispatch({ type: "toggle" });
  const handleReset = () => dispatch({ type: "reset" });
  const handleSkip = () => dispatch({ type: "skip" });
  const switchToShortBreak = () => dispatch({ type: "switchToShortBreak" });
  const startLongBreak = (mins) => dispatch({ type: "startLongBreak", mins });
  const addFiveMinutes = () => dispatch({ type: "addFiveMinutes" });

  // Re-render a few times a second so the derived countdown stays current. Mobile browsers
  // pause/throttle JS timers while the tab is hidden (backgrounded, screen locked, another app in
  // front) — there's no way for a web page to keep ticking through that, but re-rendering the
  // instant the tab becomes visible again means it snaps to the correct value right away.
  useEffect(() => {
    const tick = () => setTick((t) => t + 1);
    const interval = setInterval(tick, 250);
    const onVisible = () => {
      if (!document.hidden) tick();
    };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("resize", tick); // the layout below depends on the window size
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("resize", tick);
    };
  }, []);

  // Timer hit zero. Every participant's copy notices this at about the same moment; the first
  // write wins and the rest receive it.
  useEffect(() => {
    if (isRunning && secondsLeft <= 0) dispatch({ type: "autoComplete" });
  }, [isRunning, secondsLeft, dispatch]);

  // only start the next round once the end-of-segment sound has actually finished
  const nextAt = state.next ? state.next.at : null;
  useEffect(() => {
    if (!isTransitioning || nextAt == null) return;
    const timeout = setTimeout(() => dispatch({ type: "finishTransition" }), Math.max(0, nextAt - now()));
    return () => clearTimeout(timeout);
  }, [isTransitioning, nextAt, dispatch]);

  // The sound plays on each participant's own device, whenever a segment ends — whoever caused it.
  // During a transition `mode` is still the segment that just ended.
  const wasTransitioningRef = useRef(false);
  useEffect(() => {
    if (isTransitioning && !wasTransitioningRef.current) playSound(mode === "work" ? "workEnd" : "breakEnd");
    wasTransitioningRef.current = isTransitioning;
  }, [isTransitioning]);

  // Screen Wake Lock: keeps the screen from auto-dimming/locking while a round is running and
  // the tab is in view. Released automatically by the browser once the tab is hidden, and
  // there's no API to keep a background tab's screen awake or to override the phone's own
  // lock button — so this only helps while the timer is actually on screen.
  useEffect(() => {
    if (!("wakeLock" in navigator)) return;
    let wakeLock = null;
    async function acquire() {
      try {
        wakeLock = await navigator.wakeLock.request("screen");
      } catch (err) {
        // often rejects on low battery / when the tab isn't visible — not worth surfacing
      }
    }
    async function onVisible() {
      if (isRunning && !document.hidden && !wakeLock) await acquire();
    }
    if (isRunning) acquire();
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      if (wakeLock) wakeLock.release().catch(() => {});
    };
  }, [isRunning]);

  useEffect(() => {
    document.title = isRunning
      ? `${formatTime(secondsLeft)} — ${MODES[mode].label}`
      : "Violet Tomato – Automatic Pomodoro Focus Timer";
  }, [secondsLeft, mode, isRunning]);

  // Lock background scroll while a popup covers the screen — otherwise the page behind it can
  // still be scrolled (e.g. by touch drag), even though it's inert and visually dimmed.
  useEffect(() => {
    const modalOpen = !setupComplete || addRoundsModalOpen;
    document.documentElement.style.overflow = modalOpen ? "hidden" : "";
    document.body.style.overflow = modalOpen ? "hidden" : "";
    return () => {
      document.documentElement.style.overflow = "";
      document.body.style.overflow = "";
    };
  }, [setupComplete, addRoundsModalOpen]);

  // nothing to show until the room's current state is known — otherwise someone joining a
  // session in progress would see the setup popup flash first
  if (syncStatus === "loading") return <div className="min-h-screen w-full bg-white" />;

  const syncNoticeText =
    syncStatus === "failed" ? "Not synced — this timer is only on your screen" : syncStatus === "synced" && !connected ? "Reconnecting…" : null;
  const syncNotice = syncNoticeText && (
    <div className="fixed top-2 left-0 w-full flex justify-center pointer-events-none" style={{ zIndex: 60 }}>
      <div className="px-3 py-1 rounded-full bg-neutral-800 text-white text-xs">{syncNoticeText}</div>
    </div>
  );

  const color = MODES[mode].color;
  const shadowColor = MODES[mode].shadowColor;
  const arcColor = MODES[mode].arcColor;
  const radius = 120;
  const circumference = 2 * Math.PI * radius;
  // The colored arc is the time remaining: it starts full at 12 o'clock and its moving end
  // retreats counter-clockwise as the segment runs.
  const dashoffset = circumference * progress;
  const tipDeg = (1 - progress) * 360;
  // Soft round shadow cast by the moving end onto whatever lies just clockwise of it — the gray
  // track mid-segment, or the fixed end of the arc itself right at the start. It's a blurred disc
  // nudged ahead of the cap, so the part peeking out from under the cap is crescent-shaped.
  const shadowDeg = 1.5;
  const shadowCenter = {
    x: 140 + radius * Math.cos((shadowDeg * Math.PI) / 180),
    y: 140 + radius * Math.sin((shadowDeg * Math.PI) / 180),
  };

  const centerLabel = mode === "work" ? `Round ${completedCycles + 1}` : "";

  // Discord shows the Activity as a small tile (about 150px square on a phone) when it's minimised
  // next to the participants' video. The full layout doesn't fit there and would just be cropped,
  // so the tile gets the top of the full view — mode label and ring, with the same contents and
  // proportions — scaled down to whatever space there is, and without the controls.
  // (read at render time: the countdown re-renders this several times a second anyway)
  const viewport = { width: window.innerWidth, height: window.innerHeight };
  if (viewport.height < 320 || viewport.width < 260) {
    // the full view's sizes in px, times k: a 20px label, a 24px gap, then the 288px ring
    const k = Math.min((viewport.width * 0.92) / 288, (viewport.height * 0.92) / (20 + 24 + 288));
    const px = (n) => n * k;
    const emoji = sessionComplete
      ? ["🎉"]
      : isTransitioning
      ? [mode === "work" ? "💪" : mode === "break" ? "🙌" : "🔋"]
      : [].concat(MODES[mode].emoji);
    const caption = sessionComplete
      ? `${completedCycles} completed`
      : isTransitioning
      ? mode === "work" ? "Focus round complete" : mode === "break" ? "Break complete" : "Long break complete"
      : !setupComplete
      ? "Not started"
      : !isRunning
      ? "Paused"
      : centerLabel;
    return (
      <div className="w-full flex flex-col items-center justify-center bg-white overflow-hidden" style={{ height: "100vh" }}>
        <div className="font-bold tracking-wide uppercase" style={{ color, fontSize: px(20), lineHeight: 1 }}>
          {sessionComplete ? "Done" : MODES[mode].label}
        </div>
        <div
          className={`relative ${isTransitioning ? "animate-pulse" : ""}`}
          style={{ width: px(288), height: px(288), marginTop: px(24) }}
        >
          <svg className="w-full h-full -rotate-90" viewBox="0 0 280 280">
            <circle cx="140" cy="140" r={radius} fill="none" stroke="#EBECF0" strokeWidth="10" />
            {!sessionComplete && secondsLeft > 0 && (
              <circle
                cx="140" cy="140" r={radius} fill="none" stroke={arcColor} strokeWidth="10"
                strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={dashoffset}
                style={{ transition: "stroke-dashoffset 1s linear" }}
              />
            )}
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            <div className="flex items-center justify-center" style={{ gap: px(4), height: px(30), marginBottom: px(12) }}>
              {emoji.map((e, i) => (
                <span key={i} style={{ fontSize: px(30), lineHeight: 1 }}>{e}</span>
              ))}
            </div>
            {!sessionComplete && !isTransitioning && (
              <div className="font-bold tabular-nums text-neutral-800" style={{ fontSize: px(48), lineHeight: 1 }}>
                {formatTime(secondsLeft)}
              </div>
            )}
            {/* the caption is the one thing not scaled all the way down: 14px would become unreadable */}
            <div
              className="flex items-center justify-center text-neutral-400"
              style={{ fontSize: Math.max(8, px(14)), lineHeight: 1, height: px(30), marginTop: px(12) }}
            >
              {caption}
            </div>
          </div>
        </div>
      </div>
    );
  }

  if (sessionComplete) {
    return (
      <div className="min-h-screen w-full flex flex-col bg-white">
        {syncNotice}
        <div className="flex-1 w-full flex items-center justify-center p-6">
        <div inert={addRoundsModalOpen ? "" : undefined} className="w-full max-w-xs bg-white rounded-2xl border border-neutral-200 p-6 flex flex-col items-center text-center">
          <div className="text-[30px]">🎉</div>
          <div className="w-full flex flex-col items-center" style={{ marginTop: "20px" }}>
            <div className="text-xl font-bold text-neutral-800">{completionHeading}</div>
            <button
              onClick={() => setSummaryLogOpen((o) => !o)}
              disabled={history.length === 0}
              className="w-full flex items-center justify-center gap-1 rounded-full text-sm font-medium text-neutral-500 hover:text-neutral-700 disabled:hover:text-neutral-500 disabled:cursor-default"
              style={{ height: "44px", marginTop: "8px" }}
            >
              <span>
                {completedCycles === 1 ? "You completed 1 round" : `You completed all ${completedCycles} rounds`}
              </span>
              {history.length > 0 &&
                (summaryLogOpen ? (
                  <ChevronUpIcon size={16} style={{ color: "#808080" }} />
                ) : (
                  <ChevronDownIcon size={16} style={{ color: "#808080" }} />
                ))}
            </button>
            {summaryLogOpen && history.length > 0 && (
              <div style={{ marginBottom: "12px" }}>
                <HistoryLog history={history} />
              </div>
            )}
          </div>
          <button
            onClick={() => {
              setAddRoundsAmount(originalRoundsChoice ?? 4);
              setAddStartsWithBreak(true);
              setAddRoundsModalOpen(true);
            }}
            className="w-full flex items-center justify-center rounded-full text-sm font-medium text-neutral-500 hover:text-neutral-700"
            style={{ height: "44px", marginTop: "4px" }}
          >
            Add more rounds
          </button>
        </div>

        {addRoundsModalOpen && (
          <div
            className="fixed inset-0 z-50 flex items-center justify-center p-6"
            style={{ backgroundColor: "rgba(255,255,255,0.6)" }}
          >
            <div className="w-full max-w-sm bg-white rounded-2xl border border-neutral-200 shadow-xl p-6 flex flex-col items-center gap-6">
              <div className="w-full flex flex-col items-start gap-2">
                <div className="text-sm font-medium text-neutral-600">How many more rounds?</div>
                <div className="flex items-stretch rounded-xl border border-neutral-200">
                  <button
                    onClick={() => setAddRoundsAmount((n) => (n === null ? null : n === 1 ? null : n - 1))}
                    disabled={addRoundsAmount === null}
                    className="w-11 h-11 flex items-center justify-center rounded-l-xl bg-neutral-100 text-neutral-600 hover:bg-neutral-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-neutral-100"
                  >
                    <MinusIcon size={20} />
                  </button>
                  <span className="w-24 flex items-center justify-center border-x border-neutral-200">
                    <span className="flex items-baseline gap-1.5 tabular-nums">
                      <span className="text-xl font-bold text-neutral-800 leading-none">{addRoundsAmount === null ? "∞" : addRoundsAmount}</span>
                      {addRoundsAmount !== null && (
                        <span className="text-sm text-neutral-800 leading-none">{addRoundsAmount === 1 ? "round" : "rounds"}</span>
                      )}
                    </span>
                  </span>
                  <button
                    onClick={() => setAddRoundsAmount((n) => (n === null ? 1 : Math.min(16, n + 1)))}
                    disabled={addRoundsAmount === 16}
                    className="w-11 h-11 flex items-center justify-center rounded-r-xl bg-neutral-100 text-neutral-600 hover:bg-neutral-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-neutral-100"
                  >
                    <PlusIcon size={20} />
                  </button>
                </div>
              </div>
              <RadioGroup
                label="Start with"
                options={START_WITH_OPTIONS}
                value={addStartsWithBreak}
                onChange={setAddStartsWithBreak}
                pillClassName="px-6 py-3 rounded-xl text-sm font-medium"
              />
              <RadioGroup
                label="Long break length"
                options={LONG_BREAK_OPTIONS}
                value={longBreakMinutes}
                onChange={setLongBreakMinutes}
                pillClassName="px-4 py-3 rounded-xl text-sm font-medium whitespace-nowrap"
              />
              <div className="w-full flex flex-col items-center gap-1">
                <button
                  onClick={confirmAddRounds}
                  className="w-full px-6 py-3 rounded-full text-white font-medium bg-violet-600 hover:bg-violet-700"
                  style={{ boxShadow: "0 2px 8px -2px #7c3aed59" }}
                >
                  {addRoundsAmount === null
                    ? "Continue without a limit"
                    : addRoundsAmount === 1
                    ? "Add 1 round"
                    : `Add ${addRoundsAmount} rounds`}
                </button>
                <button
                  onClick={() => setAddRoundsModalOpen(false)}
                  className="w-full flex items-center justify-center rounded-full text-sm font-medium text-neutral-500 hover:text-neutral-700"
                  style={{ height: "44px" }}
                >
                  Cancel
                </button>
              </div>
            </div>
          </div>
        )}
        </div>
        <Credit inert={addRoundsModalOpen} />
      </div>
    );
  }

  return (
    <div className="min-h-screen w-full flex flex-col bg-white">
        {syncNotice}
      <div className="flex-1 w-full flex items-start justify-center p-6 pt-16">
      {!setupComplete && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-6"
          style={{ backgroundColor: "rgba(255,255,255,0.6)" }}
        >
          <div className="w-full max-w-sm bg-white rounded-2xl border border-neutral-200 shadow-xl p-6 flex flex-col items-center gap-6">
            <div className="w-full text-left">
              <div className="text-xl font-bold text-neutral-800">Automatic Pomodoro Focus Timer</div>
              <div className="text-sm text-neutral-400 mt-3">
                Start once: 25&#8209;minute focus rounds and 5&#8209;minute breaks switch automatically, each
                one is logged and ends with a sound alert. Every 4th round gets an optional longer break.
              </div>
            </div>

            <div className="w-full flex flex-col items-start gap-2">
              <div className="text-sm font-medium text-neutral-600">Number of rounds</div>
              <div className="flex items-stretch rounded-xl border border-neutral-200">
                <button
                  onClick={() => setRoundsLimit((r) => (r === null ? null : r === 1 ? null : r - 1))}
                  disabled={roundsLimit === null}
                  className="w-11 h-11 flex items-center justify-center rounded-l-xl bg-neutral-100 text-neutral-600 hover:bg-neutral-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-neutral-100"
                >
                  <MinusIcon size={20} />
                </button>
                <span className="w-24 flex items-center justify-center border-x border-neutral-200">
                  <span className="flex items-baseline gap-1.5 tabular-nums">
                    <span className="text-xl font-bold text-neutral-800 leading-none">{roundsLimit === null ? "∞" : roundsLimit}</span>
                    {roundsLimit !== null && (
                      <span className="text-sm text-neutral-800 leading-none">{roundsLimit === 1 ? "round" : "rounds"}</span>
                    )}
                  </span>
                </span>
                <button
                  onClick={() => setRoundsLimit((r) => (r === null ? 1 : Math.min(16, r + 1)))}
                  disabled={roundsLimit === 16}
                  className="w-11 h-11 flex items-center justify-center rounded-r-xl bg-neutral-100 text-neutral-600 hover:bg-neutral-200 disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-neutral-100"
                >
                  <PlusIcon size={20} />
                </button>
              </div>
            </div>

            <RadioGroup
              label="Long break length"
              options={LONG_BREAK_OPTIONS}
              value={longBreakMinutes}
              onChange={setLongBreakMinutes}
              pillClassName="px-4 py-3 rounded-xl text-sm font-medium whitespace-nowrap"
            />

            <button
              onClick={startSession}
              className="w-full px-6 py-3 rounded-full text-white font-medium bg-violet-600 hover:bg-violet-700"
              style={{ boxShadow: "0 2px 8px -2px #7c3aed59" }}
            >
              Start
            </button>
          </div>
        </div>
      )}

      <div inert={!setupComplete ? "" : undefined} className="w-full max-w-sm flex flex-col items-center">
        <div className="text-xl font-bold tracking-wide uppercase" style={{ color }}>
          {MODES[mode].label}
        </div>

        <div className={`relative w-72 h-72 ${isTransitioning ? "animate-pulse" : ""}`} style={{ marginTop: "24px" }}>
          <svg className="w-full h-full -rotate-90" viewBox="0 0 280 280">
            <defs>
              <radialGradient id="ring-tip-shadow">
                <stop offset="0%" stopColor={shadowColor} stopOpacity="0.25" />
                <stop offset="45%" stopColor={shadowColor} stopOpacity="0.07" />
                <stop offset="100%" stopColor={shadowColor} stopOpacity="0" />
              </radialGradient>
              {/* keeps the shadow inside the ring's band */}
              <clipPath id="ring-band">
                <path
                  clipRule="evenodd"
                  d={`M 140 ${140 - radius - 5} a ${radius + 5} ${radius + 5} 0 1 0 0.01 0 Z
                      M 140 ${140 - radius + 5} a ${radius - 5} ${radius - 5} 0 1 0 0.01 0 Z`}
                />
              </clipPath>
            </defs>
            <circle cx="140" cy="140" r={radius} fill="none" stroke="#EBECF0" strokeWidth="10" />
            <circle
              cx="140" cy="140" r={radius} fill="none" stroke={arcColor} strokeWidth="10"
              strokeLinecap="round" strokeDasharray={circumference} strokeDashoffset={dashoffset}
              style={{ transition: "stroke-dashoffset 1s linear" }}
            />
            {/* Moving end: shadow patch plus a cap drawn on top of it, rotated as one piece so it
                tracks the arc with the same 1s linear easing. */}
            <g
              style={{
                transform: `rotate(${tipDeg}deg)`,
                transformOrigin: "140px 140px",
                transition: "transform 1s linear",
                display: secondsLeft > 0 ? undefined : "none",
              }}
            >
              <circle
                cx={shadowCenter.x} cy={shadowCenter.y} r="8"
                fill="url(#ring-tip-shadow)" clipPath="url(#ring-band)"
              />
              <circle cx={140 + radius} cy="140" r="5" fill={arcColor} />
            </g>
          </svg>
          <div className="absolute inset-0 flex flex-col items-center justify-center">
            {isTransitioning ? (
              <>
                <div style={{ fontSize: "30px", lineHeight: "34px" }}>{mode === "work" ? "💪" : mode === "break" ? "🙌" : "🔋"}</div>
                <div className="text-sm text-neutral-400 mt-1">
                  {mode === "work" ? "Focus round complete" : mode === "break" ? "Break complete" : "Long break complete"}
                </div>
              </>
            ) : (
              <>
                <div
                  className="flex items-center justify-center gap-1"
                  style={{ height: "30px", marginBottom: "12px" }}
                >
                  {Array.isArray(MODES[mode].emoji) ? (
                    MODES[mode].emoji.map((e, i) => (
                      <span key={i} style={{ fontSize: "30px", lineHeight: "30px" }}>{e}</span>
                    ))
                  ) : (
                    <span style={{ fontSize: "30px", lineHeight: "30px" }}>{MODES[mode].emoji}</span>
                  )}
                </div>
                <div className="text-5xl font-bold tabular-nums text-neutral-800">{formatTime(secondsLeft)}</div>
                <div
                  className="flex items-center justify-center text-sm text-neutral-400"
                  style={{ height: "30px", marginTop: "12px" }}
                >
                  {mode === "work" ? centerLabel : ""}
                </div>
              </>
            )}
          </div>
        </div>

        <div className="flex items-center gap-5" style={{ marginTop: "24px" }}>
          <button
            onClick={handleReset}
            disabled={isTransitioning}
            className="flex items-center justify-center rounded-full bg-neutral-200 text-neutral-600 hover:bg-neutral-300 disabled:opacity-40 disabled:cursor-not-allowed"
            style={{ height: "44px", width: "44px" }}
            title="Reset current round"
          >
            <RotateCcwIcon size={20} />
          </button>
          {(() => {
            const buttonLabel = isTransitioning
              ? preTransitionLabel
              : isRunning
              ? "Pause"
              : secondsLeft === totalSeconds
              ? "Start"
              : "Resume";
            const looksActive = buttonLabel === "Pause";
            return (
              <button
                onClick={handleToggle}
                disabled={isTransitioning}
                aria-label={buttonLabel}
                title={buttonLabel}
                className={`flex items-center justify-center rounded-full disabled:opacity-40 disabled:cursor-not-allowed ${
                  looksActive ? "bg-neutral-200 text-neutral-600 hover:bg-neutral-300" : "text-white"
                }`}
                style={{
                  height: "56px",
                  width: "56px",
                  ...(looksActive ? {} : { backgroundColor: color, boxShadow: `0 2px 8px -2px ${shadowColor}59` }),
                }}
              >
                {looksActive ? <PauseIcon size={20} /> : <PlayIcon size={20} />}
              </button>
            );
          })()}
          <button
            onClick={handleSkip}
            disabled={isTransitioning}
            className="flex items-center justify-center rounded-full bg-neutral-200 text-neutral-600 hover:bg-neutral-300 disabled:opacity-40 disabled:cursor-not-allowed"
            style={{ height: "44px", width: "44px" }}
            title="Skip"
          >
            <SkipForwardIcon size={20} />
          </button>
        </div>

        {mode === "longBreak" ? (
          <div className="flex flex-col items-center" style={{ marginTop: "24px", gap: "4px" }}>
            <button
              onClick={switchToShortBreak}
              disabled={isTransitioning}
              className="flex items-center justify-center px-4 rounded-full text-sm font-medium text-neutral-500 hover:text-neutral-700 disabled:opacity-40 disabled:cursor-not-allowed"
              style={{ height: "44px" }}
            >
              Switch to 5 min break
            </button>
            <button
              onClick={addFiveMinutes}
              disabled={isTransitioning}
              className="flex items-center justify-center px-4 rounded-full text-sm font-medium text-neutral-500 hover:text-neutral-700 disabled:opacity-40 disabled:cursor-not-allowed"
              style={{ height: "44px" }}
            >
              Add another 5 min
            </button>
          </div>
        ) : (
          <button
            onClick={() => startLongBreak()}
            disabled={isTransitioning}
            className="flex items-center justify-center px-4 rounded-full text-sm font-medium text-neutral-500 hover:text-neutral-700 disabled:opacity-40 disabled:cursor-not-allowed"
            style={{ height: "44px", marginTop: "24px" }}
          >
            {mode === "break" ? "Switch to long break" : "Start long break"}
          </button>
        )}

        <div className="w-full flex flex-col items-center gap-1" style={{ marginTop: "24px" }}>
          <button
            onClick={() => setLogOpen((o) => !o)}
            className="flex items-center"
            style={{ minHeight: "44px" }}
          >
            <span className="flex items-baseline gap-1.5">
              <span className="text-xl font-bold text-neutral-900 leading-none">{completedCycles}</span>
              <span className="text-sm text-neutral-900 leading-none">completed</span>
              {completedCycles > 0 && (
                <span className="self-end py-px">
                  {logOpen ? (
                    <ChevronUpIcon size={16} style={{ color: "#808080" }} />
                  ) : (
                    <ChevronDownIcon size={16} style={{ color: "#808080" }} />
                  )}
                </span>
              )}
            </span>
          </button>

          {logOpen && history.length > 0 && <HistoryLog history={history} />}
        </div>
      </div>
      </div>
      <Credit inert={!setupComplete} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PomodoroTimer />);
</script>
</body>
</html>
